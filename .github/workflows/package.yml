name: Packages

# Builds the Windows installer and no-install archive and the macOS app. A version tag also
# publishes them as a release, with the list of program files the in-app update reads.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: |
            src-tauri -> target
            stt-worker -> target

      # The speech worker is built first by the app's own build command.
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      - name: Make the no-install archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable, out | Out-Null
          Copy-Item src-tauri/target/release/opentypeless.exe, src-tauri/target/release/ot-stt-worker.exe portable/
          Compress-Archive -Path portable/* -DestinationPath out/OpenTypeless-windows-x64-portable.zip
          # The program files on their own, for updating in place.
          Copy-Item portable/opentypeless.exe out/opentypeless-windows-x64.exe
          Copy-Item portable/ot-stt-worker.exe out/ot-stt-worker-windows-x64.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)[0].FullName out/OpenTypeless-windows-x64-setup.exe
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: opentypeless-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: out/*

      # After the upload, so a failing test still leaves a package to try.
      # A failing test is reported in the log and does not hold back the package.
      - name: Test the worker protocol
        continue-on-error: true
        run: cargo test --manifest-path stt-protocol/Cargo.toml
      - name: Test the speech worker
        continue-on-error: true
        working-directory: stt-worker
        run: cargo test --release
      - name: Test the app
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: |
            src-tauri -> target
            stt-worker -> target

      # Signed ad hoc: no developer identity is involved.
      - name: Build the app
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --bundles app

      - name: Make the archive
        run: |
          codesign --verify --deep src-tauri/target/release/bundle/macos/OpenTypeless.app
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/OpenTypeless.app OpenTypeless-macos-arm64.zip
          ls -l OpenTypeless-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: opentypeless-macos-arm64
          retention-days: 14
          if-no-files-found: error
          path: OpenTypeless-macos-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the program files for the in-app update
        run: node scripts/update-manifest.mjs dist "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
