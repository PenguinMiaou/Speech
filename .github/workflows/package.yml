name: Packages

# Builds the Windows installer and no-install archive and the macOS disk image. A version tag also
# publishes them as a release, with the list of program files the in-app update reads.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Without GGML_NATIVE=OFF the recognition library is compiled for whatever processor
      # the build machine has. On a machine with AVX-512 the result crashes on the many
      # computers that lack it. OFF fixes the instruction set at AVX2.
      TRANSCRIBE_CMAKE_ARGS: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_NATIVE=OFF
      # The recognizer uses the graphics processor through Vulkan where there is one;
      # the app has it do without where that fails.
      OT_STT_FEATURES: vulkan
      VULKAN_SDK_VERSION: 1.4.309.0
      VULKAN_SDK_SHA256: 48b132169b64fe65cdb0f20970195335a65354e73f1ea5373032c2a8bbad4297
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: |
            src-tauri -> target
            stt-worker -> target

      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $file = "VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/$file" -OutFile $file
          $sum = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne $env:VULKAN_SDK_SHA256) { throw "the Vulkan SDK installer is not the expected file" }
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          Start-Process -Wait -FilePath ".\$file" -ArgumentList "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "the Vulkan SDK was not installed" }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The recognizer's Vulkan part asks for these headers as a CMake package, which
      # the SDK does not bring. They are taken at the commit that goes with the SDK.
      - name: Install the SPIR-V headers
        shell: pwsh
        run: |
          git init -q spirv-headers
          git -C spirv-headers fetch -q --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git 09913f088a1197aba4aefd300a876b2ebbaa3391
          git -C spirv-headers checkout -q FETCH_HEAD
          cmake -S spirv-headers -B spirv-headers/build "-DCMAKE_INSTALL_PREFIX=C:\spirv-headers" -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          cmake --build spirv-headers/build --target install --config Release
          if (-not (Test-Path "C:\spirv-headers\share\cmake\SPIRV-Headers\SPIRV-HeadersConfig.cmake")) { throw "the SPIR-V headers were not installed" }
          "TRANSCRIBE_CMAKE_ARGS=$env:TRANSCRIBE_CMAKE_ARGS -DSPIRV-Headers_DIR=C:/spirv-headers/share/cmake/SPIRV-Headers" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item -Recurse -Force spirv-headers

      # The speech worker is built first by the app's own build command.
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      # The worker must start on a machine without Vulkan, so Vulkan may only be loaded late.
      - name: Check that the worker starts without Vulkan
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $listed = (& $dumpbin /dependents src-tauri/target/release/ot-stt-worker.exe) -join "`n"
          $at = $listed.IndexOf("delay load dependencies")
          if ($listed -notmatch "vulkan-1.dll") { throw "the worker was built without Vulkan" }
          if ($at -lt 0 -or $listed.Substring(0, $at) -match "vulkan-1.dll") { throw "Vulkan is not loaded late" }

      - name: Make the no-install archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable, out | Out-Null
          Copy-Item src-tauri/target/release/opentypeless.exe, src-tauri/target/release/ot-stt-worker.exe portable/
          Compress-Archive -Path portable/* -DestinationPath out/Speech-windows-x64-portable.zip
          # The program files on their own, for updating in place.
          Copy-Item portable/opentypeless.exe out/opentypeless-windows-x64.exe
          Copy-Item portable/ot-stt-worker.exe out/ot-stt-worker-windows-x64.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)[0].FullName out/Speech-windows-x64-setup.exe
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: opentypeless-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: out/*

      # After the upload, so a failing test still leaves a package to try.
      # A failing test is reported in the log and does not hold back the package.
      - name: Test the worker protocol
        continue-on-error: true
        run: cargo test --manifest-path stt-protocol/Cargo.toml
      - name: Test the speech worker
        continue-on-error: true
        working-directory: stt-worker
        run: cargo test --release
      - name: Test the app
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    # The signing certificate lives in an environment that only version tags may use.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: |
            src-tauri -> target
            stt-worker -> target

      # A release is signed with the Developer ID certificate and notarized by Apple. Any other
      # build is signed ad hoc.
      - name: Choose the signature
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            } >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
          if [ -n "$CERTIFICATE" ] && [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            {
              echo "APPLE_API_KEY=$API_KEY"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            } >> "$GITHUB_ENV"
          fi

      - name: Build the app
        run: npm run tauri build -- --bundles app

      # The disk image opens to a window where the app is dragged onto Applications. dmgbuild
      # writes the window layout into the image itself, which works without a desktop session.
      - name: Build the disk image
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s src-tauri/dmg/settings.py \
            -D app=src-tauri/target/release/bundle/macos/Speech.app \
            Speech Speech-macos-arm64.dmg
          # The app build removes the keychain it signed with, so the certificate is
          # imported again for the image, into a keychain that is deleted right after.
          if [ "$APPLE_SIGNING_IDENTITY" != "-" ]; then
            KEYCHAIN="$RUNNER_TEMP/disk-image.keychain-db"
            KEYCHAIN_PASSWORD=$(uuidgen)
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
            rm "$RUNNER_TEMP/certificate.p12"
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            codesign --force --timestamp --keychain "$KEYCHAIN" \
              --sign "$APPLE_SIGNING_IDENTITY" Speech-macos-arm64.dmg
            security list-keychains -d user -s login.keychain-db
            security delete-keychain "$KEYCHAIN"
          fi

      - name: Check the app and notarize the disk image
        run: |
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/Speech.app
          codesign -dvv src-tauri/target/release/bundle/macos/Speech.app 2>&1 | grep -E 'Signature=|TeamIdentifier=|flags='
          # Says whether this Mac would open the app as downloaded. Not a failure for ad hoc builds.
          spctl -a -t exec -vv src-tauri/target/release/bundle/macos/Speech.app 2>&1 | grep -E 'accepted|rejected|source=' || true
          if [ -n "$APPLE_API_KEY_PATH" ]; then
            xcrun notarytool submit Speech-macos-arm64.dmg --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
            xcrun stapler staple Speech-macos-arm64.dmg
            spctl -a -t open --context context:primary-signature -vv Speech-macos-arm64.dmg 2>&1 | grep -E 'accepted|rejected|source=' || true
          fi
          ls -l Speech-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: opentypeless-macos-arm64
          retention-days: 14
          if-no-files-found: error
          path: Speech-macos-arm64.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the program files for the in-app update
        run: node scripts/update-manifest.mjs dist "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # The release page lists only what a person downloads to install.
          gh release create "$GITHUB_REF_NAME" \
            dist/Speech-macos-arm64.dmg \
            dist/Speech-windows-x64-setup.exe \
            dist/Speech-windows-x64-portable.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
          # The files the in-app update fetches live in one separate entry, replaced each
          # release. The list of them goes up last, so it never names a file not yet there.
          gh release view update-files >/dev/null 2>&1 || gh release create update-files \
            --title "Files for the in-app update" --prerelease --latest=false --target "$GITHUB_SHA" \
            --notes "The app downloads these when it updates itself. To install, use the latest release."
          gh release upload update-files --clobber \
            dist/opentypeless-windows-x64.exe dist/ot-stt-worker-windows-x64.exe
          gh release upload update-files --clobber dist/update-manifest.json
