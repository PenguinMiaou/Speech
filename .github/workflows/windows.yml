name: Windows package

# Builds the Windows installer and a no-install archive, then runs the tests there.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: |
            src-tauri -> target
            stt-worker -> target

      # The speech worker is built first by the app's own build command.
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      - name: Make the no-install archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/*.exe portable/
          Compress-Archive -Path portable/* -DestinationPath OpenTypeless-windows-x64-portable.zip
          Get-ChildItem portable, src-tauri/target/release/bundle/nsis | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: opentypeless-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            OpenTypeless-windows-x64-portable.zip

      # After the upload, so a failing test still leaves a package to try.
      - name: Test the worker protocol
        run: cargo test --manifest-path stt-protocol/Cargo.toml
      - name: Test the speech worker
        run: cargo test --manifest-path stt-worker/Cargo.toml --release
      - name: Test the app
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
